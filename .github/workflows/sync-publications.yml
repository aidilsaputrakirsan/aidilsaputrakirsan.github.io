name: Sync academic data (OpenAlex + SINTA + PDDikti)

# Monthly: refresh publications (OpenAlex), research grants / community
# service (SINTA) and teaching history (PDDikti); if anything changed, commit and redeploy. Each source may
# fail on its own (e.g. SINTA blocking) without losing the other's update. Also runnable by hand (Actions → Run workflow).
on:
  schedule:
    - cron: '0 1 1 * *' # 1st of every month, 08:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch publications (OpenAlex)
        continue-on-error: true
        run: node scripts/sync-publications.mjs

      - name: Fetch research & community service (SINTA)
        continue-on-error: true
        run: node scripts/sync-sinta.mjs

      - name: Fetch teaching history (PDDikti)
        continue-on-error: true
        run: node scripts/sync-pddikti.mjs

      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/publications.openalex.json src/data/sinta.json src/data/pddikti.json; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.openalex.json src/data/sinta.json src/data/pddikti.json
          git commit -m "Sync academic data from OpenAlex, SINTA and PDDikti"
          git push
          gh workflow run deploy.yml --ref main
